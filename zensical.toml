[project]
site_name = "ezapi-tmdb"
site_author = "Zeheng Li"
nav = [{ "Home" = "index.md" }]
repo_name = "ezapi-tmdb"
repo_url = "https://github.com/zehengl/ezapi-tmdb"

[project.plugins.minify]
minify_html = true
minify_css = true

[project.plugins.git-revision-date-localized]
type = "timeago"
enable_creation_date = true

[project.theme]
variant = "classic"
favicon = "https://www.themoviedb.org/assets/2/v4/logos/v2/blue_square_2-d537fb228cf3ded904ef09b136fe3fec72548ebc1fea3fbbd1ad9e36364db38b.svg"
logo = "https://www.themoviedb.org/assets/2/v4/logos/v2/blue_square_2-d537fb228cf3ded904ef09b136fe3fec72548ebc1fea3fbbd1ad9e36364db38b.svg"
font.text = "Roboto"
features = ["header.autohide", "content.code.copy"]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "material/brightness-auto"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "indigo"
accent = "indigo"
toggle.icon = "material/toggle-switch"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "indigo"
accent = "indigo"
toggle.icon = "material/toggle-switch-off-outline"
toggle.name = "Switch to light mode"

[project.markdown_extensions]
attr_list = {}
md_in_html = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.snippets = {}
pymdownx.superfences = {}


[project.extra]
social = [
  { icon = "fontawesome/brands/github", link = "https://github.com/zehengl" },
  { icon = "fontawesome/brands/linkedin", link = "https://linkedin.com/in/zehengl" },
]
